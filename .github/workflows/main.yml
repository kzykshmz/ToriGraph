name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sdk-lint:
    name: Python SDK Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and verify torigraph Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python
          python -m compileall -q python/torigraph
          python -c "import torigraph as tg; print('torigraph SDK OK:', tg.__file__)"

  windows-build-test:
    name: Windows MSVC Build & Test
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable MSVC x64 Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up conda-forge C++ & Python dependencies (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: torigraph-ci
          cache-downloads: true
          create-args: >-
            qt-main=5.15
            gsl
            muparser
            zlib
            ninja
            cmake
            python=3.11
            numpy
            pandas
            python-pptx

      - name: Link .deps junction to micromamba environment
        run: |
          $envDir = (micromamba run -n torigraph-ci python -c "import os; print(os.environ['CONDA_PREFIX'])").Trim()
          Write-Host "CONDA_PREFIX=$envDir"
          "TORIGRAPH_CONDA_PREFIX=$envDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path .deps) { Remove-Item -Recurse -Force .deps }
          New-Item -ItemType Junction -Path .deps -Target $envDir | Out-Null

      - name: Configure with CMake (Ninja + MSVC)
        run: |
          $prefix = Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library"
          micromamba run -n torigraph-ci cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DORIGIN_IMPORT=ON `
            -DBUILD_QWT=ON `
            -DBUILD_QWTPLOT3D=ON `
            -DSCRIPTING_PYTHON=OFF `
            -DBUILD_TESTS=OFF

      - name: Build ToriGraph & OLE/Regression Test Suite
        run: |
          micromamba run -n torigraph-ci cmake --build build --target scidavis scidavis_ole_test --parallel

      - name: Set display resolution to 1920x1080 for GUI layout tests
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class DisplayHelper {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
                  public int dmFields; public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation;
                  public int dmDisplayFixedOutput; public short dmColor; public short dmDuplex; public short dmYResolution;
                  public short dmTTOption; public short dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;
                  public int dmDisplayFlags; public int dmDisplayFrequency;
                  public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType;
                  public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Ansi)]
              public static extern bool EnumDisplaySettings(string lpszDeviceName, int iModeNum, ref DEVMODE lpDevMode);
              [DllImport("user32.dll", CharSet = CharSet.Ansi)]
              public static extern int ChangeDisplaySettings(ref DEVMODE lpDevMode, int dwFlags);
              public static string SetBestResolution() {
                  DEVMODE cur = new DEVMODE(); cur.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  EnumDisplaySettings(null, -1, ref cur);
                  string before = cur.dmPelsWidth + "x" + cur.dmPelsHeight;
                  DEVMODE best = cur;
                  int bestScore = cur.dmPelsWidth * cur.dmPelsHeight;
                  DEVMODE dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  for (int i = 0; EnumDisplaySettings(null, i, ref dm); i++) {
                      if (dm.dmPelsWidth == 1920 && dm.dmPelsHeight == 1080) { best = dm; break; }
                      int score = dm.dmPelsWidth * dm.dmPelsHeight;
                      if (dm.dmPelsWidth >= 1600 && dm.dmPelsHeight >= 900 && score > bestScore) {
                          best = dm; bestScore = score;
                      }
                  }
                  int rc = ChangeDisplaySettings(ref best, 0);
                  DEVMODE after = new DEVMODE(); after.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  EnumDisplaySettings(null, -1, ref after);
                  return "before=" + before + " -> after=" + after.dmPelsWidth + "x" + after.dmPelsHeight + " (rc=" + rc + ")";
              }
          }
          "@
          Write-Host ([DisplayHelper]::SetBestResolution())

      - name: Run C++ Automated Test Suite (scidavis_ole_test)
        run: |
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\plugins\platforms"
          $env:PATH = (Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\bin") + ";" + $env:PATH
          cmd /c ".\build\scidavis\scidavis_ole_test.exe 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python SDK Headless Smoke Test
        run: |
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\plugins\platforms"
          $env:PATH = (Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\bin") + ";" + $env:PATH
          $env:TORIGRAPH_EXE = (Resolve-Path .\build\scidavis\ToriGraph.exe).Path
          micromamba run -n torigraph-ci python -m pip install --no-build-isolation --no-deps -e ./python
          @'
          from pathlib import Path
          import torigraph as tg

          with tg.launch(headless=True, language="en") as app:
              info = app.info()
              print("App info:", info)
              sample = app.load_sample_dataset("tensile_alznmg", auto_plot=True)
              g = app.graph(sample["graph"])
              res = g.analyze_tensile(offset=0.002, plot_construction=True)
              print("Tensile analysis:", res)
              out_png = Path("ci_smoke.png")
              out_pptx = Path("ci_smoke.pptx")
              g.export(out_png, dpi=300)
              g.to_pptx(out_pptx, preset="slide_28pt")
              assert out_png.is_file() and out_png.stat().st_size > 1000
              assert out_pptx.is_file() and out_pptx.stat().st_size > 1000
              print("Python SDK smoke test PASSED")
          '@ | micromamba run -n torigraph-ci python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
