name: Release Windows Installer

# Triggered by pushing a tag vX.Y.Z. The tag must equal the CMake project()
# VERSION (single source of truth, see scripts/check_version.py); otherwise the
# workflow stops before building. workflow_dispatch builds and tests the current
# branch and uploads the artifacts, but never publishes a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows All-in-One Installer (App + OLE + Python SDK)
    # windows-latest (Windows Server 2025 / newer MSVC STL) breaks the Qt 5.15 headers
    # with "stdext" errors; pin the image that main.yml is known to build on.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python (version check)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release version and check it against the tag
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = (python scripts/check_version.py --print --tag "$env:GITHUB_REF_NAME")
          } else {
            $ver = (python scripts/check_version.py --print)
          }
          if ($LASTEXITCODE -ne 0 -or -not $ver) {
            throw "Version check failed: the tag and CMakeLists.txt project() VERSION / python/torigraph/__init__.py must agree."
          }
          $ver = $ver.Trim()
          Write-Host "Release version: $ver"
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable MSVC x64 Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up conda-forge C++ & Python dependencies (micromamba, lightweight netlib BLAS)
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: powershell
          environment-name: torigraph-release
          cache-downloads: true
          create-args: >-
            qt-main=5.15
            gsl
            libblas=*=*netlib
            libcblas=*=*netlib
            muparser
            zlib
            ninja
            cmake
            python=3.11
            setuptools
            wheel
            pip
            numpy
            pandas
            python-pptx
            pytest

      - name: Link .deps junction to micromamba environment
        run: |
          $envDir = (micromamba run -n torigraph-release python -c "import os; print(os.environ['CONDA_PREFIX'])").Trim()
          "TORIGRAPH_CONDA_PREFIX=$envDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path .deps) { Remove-Item -Recurse -Force .deps }
          New-Item -ItemType Junction -Path .deps -Target $envDir | Out-Null

      - name: Configure with CMake (Ninja + MSVC)
        run: |
          $prefix = Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library"
          micromamba run -n torigraph-release cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DORIGIN_IMPORT=ON `
            -DBUILD_QWT=ON `
            -DBUILD_QWTPLOT3D=ON `
            -DBUILD_TESTS=OFF

      - name: Build ToriGraph, Fit Plugins & Regression Test Suite
        run: |
          micromamba run -n torigraph-release cmake --build build --target scidavis scidavis_ole_test explin exp_saturation fitRational0 fitRational1 planck_wavelength --parallel

      - name: Set display resolution to 1920x1080 for GUI layout tests
        run: ./scripts/ci-set-display-resolution.ps1

      - name: Run C++ Automated Test Suite (scidavis_ole_test) before packaging
        run: |
          $env:QT_OPENGL = "software"
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\plugins\platforms"
          $env:PATH = (Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\bin") + ";" + $env:PATH
          cmd /c ".\build\scidavis\scidavis_ole_test.exe 2>&1"
          $ec = $LASTEXITCODE
          Write-Host ("scidavis_ole_test exit code = {0} (0x{1:X8})" -f $ec, ($ec -band 0xFFFFFFFF))
          if ($ec -ne 0) { exit $ec }

      - name: Run Python SDK smoke & regression tests before packaging
        run: |
          $env:QT_OPENGL = "software"
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\plugins\platforms"
          $env:PATH = (Join-Path $env:TORIGRAPH_CONDA_PREFIX "Library\bin") + ";" + $env:PATH
          $env:TORIGRAPH_EXE = (Resolve-Path .\build\scidavis\ToriGraph.exe).Path
          micromamba run -n torigraph-release python -m pip install --no-build-isolation --no-deps -e ./python
          micromamba run -n torigraph-release python -m pytest python/tests -m "not slow" --durations=10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build All-in-One Windows Installer (.exe) & Portable Archive (.zip)
        run: |
          $pyDir = $env:TORIGRAPH_CONDA_PREFIX
          $env:PATH = "$pyDir;$pyDir\Scripts;$env:PATH"
          & .\scripts\build-windows-installer.ps1 -Version "$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\ToriGraph-$env:RELEASE_VERSION-win64-setup.exe")) {
            throw "Inno Setup did not produce dist\ToriGraph-$env:RELEASE_VERSION-win64-setup.exe"
          }

      - name: Verify Silent Install, OLE Registry & Python SDK Integration
        run: |
          $setupExe = (Get-ChildItem dist\ToriGraph-*-win64-setup.exe | Select-Object -First 1).FullName
          if (-not $setupExe) { throw "Setup executable was not produced!" }
          $installDir = Join-Path $env:RUNNER_TEMP "ToriGraphInstallTest"
          Write-Host "Testing silent install of $setupExe into $installDir"
          Start-Process -FilePath $setupExe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -Wait -NoNewWindow

          # Verify main binary, license files & OLE registry keys
          foreach ($rel in @("ToriGraph.exe", "LICENSE", "LICENSE-GPL-3.0.txt", "THIRD_PARTY_LICENSES.md")) {
            if (-not (Test-Path (Join-Path $installDir $rel))) { throw "$rel missing after silent install!" }
          }
          if (Get-ChildItem $installDir -Filter "mkl_*.dll" -ErrorAction SilentlyContinue) {
            throw "Intel MKL DLLs must not be shipped in the installer!"
          }
          $oleKey = "HKCU:\Software\Classes\CLSID\{8E6B9541-3C74-4D28-A915-7D84E5A12001}\LocalServer32"
          if (-not (Test-Path $oleKey)) {
            throw "OLE LocalServer32 registry key missing after install!"
          }
          $srvExe = (Get-ItemProperty -Path $oleKey -Name "ServerExecutable" -ErrorAction SilentlyContinue).ServerExecutable
          $expectedExe = [System.IO.Path]::GetFullPath((Join-Path $installDir "ToriGraph.exe"))
          if (-not $srvExe -or ([System.IO.Path]::GetFullPath($srvExe) -ine $expectedExe)) {
            throw "OLE ServerExecutable '$srvExe' does not point to the installed $expectedExe"
          }
          $srvCmd = (Get-ItemProperty -Path $oleKey -Name "(default)" -ErrorAction SilentlyContinue)."(default)"
          if (-not $srvCmd -or -not $srvCmd.ToLowerInvariant().Contains($expectedExe.ToLowerInvariant())) {
            throw "OLE LocalServer32 command '$srvCmd' does not start the installed $expectedExe"
          }
          Write-Host "Verified OLE ServerExecutable: $srvExe"

          # Verify Python SDK installation & auto-discovery
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:TORIGRAPH_EXE = ""
          micromamba run -n torigraph-release python -m pip install --no-deps --force-reinstall (Get-ChildItem "$installDir\python\wheels\torigraph-*.whl" | Select-Object -First 1).FullName
          micromamba run -n torigraph-release python -c "import torigraph as tg; from torigraph.client import _discover_torigraph_executable; p = _discover_torigraph_executable(); print('Auto-discovered:', p, 'SDK', tg.__version__); assert p.is_file(); assert tg.__version__ == '$env:RELEASE_VERSION'"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ToriGraph-Windows-Installer-${{ env.RELEASE_VERSION }}
          path: |
            dist/ToriGraph-*-win64-setup.exe
            dist/ToriGraph-*-win64-portable.zip
            dist/SHA256SUMS.txt

      - name: Generate Release Notes with SHA-256 Checksums
        # Only a real tag push publishes; workflow_dispatch run on a tag ref must not.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          $sums = Get-Content -Path dist/SHA256SUMS.txt -Raw
          @"
          ## Windows All-in-One Installer (Recommended)

          Download **``ToriGraph-$($env:RELEASE_VERSION)-win64-setup.exe``** to install:
          - **ToriGraph** desktop application (Qt5 / GSL / muParser / Fit Plugins / Bilingual JA & EN UI)
          - **Windows OLE Server (`ToriGraph.Graph.1`)** for PowerPoint / Word double-click in-place graph re-editing (per-user `HKCU`, no admin required)
          - **Python Automation SDK (`torigraph`)** installed offline from bundled wheel + `TORIGRAPH_EXE` environment variable
          - **Built-in Auto-Updater** with SHA-256 integrity verification

          A standalone portable archive (**``ToriGraph-$($env:RELEASE_VERSION)-win64-portable.zip``**) is also provided.

          ### SHA-256 Checksums
          ``````text
          $($sums.Trim())
          ``````
          "@ | Set-Content -Path dist/RELEASE_NOTES.md -Encoding utf8

      - name: Publish GitHub Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/ToriGraph-*-win64-setup.exe
            dist/ToriGraph-*-win64-portable.zip
            dist/SHA256SUMS.txt
