[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torigraph"
# The version is read from torigraph/__init__.py (__version__), which must match
# the top-level CMakeLists.txt project() VERSION (checked by CMake and
# scripts/check_version.py).
dynamic = ["version"]
description = "Pure-Python JSON-RPC 2.0 Automation SDK for ToriGraph scientific plotting & data analysis"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "ToriGraph Project" }
]
keywords = ["torigraph", "scidavis", "plotting", "fitting", "spectroscopy", "materials-science", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
]
visual = [
    "Pillow>=9.0",
    "PyMuPDF>=1.22",
]
dev = [
    "pytest>=7",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "Pillow>=9.0",
    "PyMuPDF>=1.22",
]

[tool.setuptools.dynamic]
version = { attr = "torigraph.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "app: drives a real ToriGraph process (skipped when the executable is not found)",
    "slow: long end-to-end gate; deselect with -m \"not slow\"",
    "gui: opens a visible (non-headless) ToriGraph window",
    "visual: perceptual image/PDF rendering & DPI-invariance regression checks",
    "fuzz: property-based Hypothesis boundary and serialization fuzz tests",
]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B006", "B012", "B015", "B018", "B023", "PLE"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["F841"]
"tests/*.py" = ["F841"]

[tool.setuptools.packages.find]
where = ["."]
include = ["torigraph*"]

[tool.setuptools.package-data]
# PEP 561: the package ships inline type hints.
torigraph = ["py.typed"]
